# Stack completa numa VPS: Caddy + Chatwoot + agente + Postgres + Redis + backup.
# Guia passo a passo: deploy/README.md.
#   Primeira vez:  docker compose up -d        (dentro de deploy/)
#   Atualizar:     ./deploy.sh <tag-da-imagem>

x-chatwoot: &chatwoot
  # Fixe a versão (ex.: chatwoot/chatwoot:v4.x.y) em CHATWOOT_IMAGE antes da produção.
  image: ${CHATWOOT_IMAGE:-chatwoot/chatwoot:latest}
  env_file: .env
  environment:
    RAILS_ENV: production
    NODE_ENV: production
    INSTALLATION_ENV: docker
    POSTGRES_HOST: postgres
    POSTGRES_DATABASE: chatwoot
    REDIS_URL: redis://redis:6379
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

x-agent: &agent
  # Imagem publicada pelo CI no GitHub Container Registry; deploy.sh troca a tag.
  image: ${AGENT_IMAGE:-ghcr.io/cmoro-rayanne/whatsapp-ai-agent:dev}
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/agent
    REDIS_URL: redis://redis:6379/1
    CHATWOOT_BASE_URL: http://chatwoot-web:3000
    TRUST_PROXY: "true"
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    env_file: .env
    restart: unless-stopped

  chatwoot-web:
    <<: *chatwoot
    command: sh -c "bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"

  chatwoot-sidekiq:
    <<: *chatwoot
    command: bundle exec sidekiq -C config/sidekiq.yml

  agent-api:
    <<: *agent
    command: sh -c "node dist/adapters/db/migrate.js && node dist/main.js"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  agent-worker:
    <<: *agent
    command: node dist/worker.js
    depends_on:
      agent-api: { condition: service_healthy }

  postgres:
    # O Chatwoot precisa da extensão pgvector.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chatwoot
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-agent-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Backup diário dos dois bancos (chatwoot e agent), guardando BACKUP_KEEP_DAYS dias.
  # Cópia para fora da VPS: ver "Backup" no deploy/README.md.
  backup:
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USERNAME}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  caddy_data:
  pg_data:
  redis_data:
