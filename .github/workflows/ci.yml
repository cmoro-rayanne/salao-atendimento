name: CI

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://agent:agent@localhost:5432/agent
      TEST_DATABASE_URL: postgres://agent:agent@localhost:5432/agent
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run migrate
      - run: npm test
      - run: npm run build
      - run: npm run build:web
      # Bloqueia só vulnerabilidades altas em dependências de produção.
      - run: npm audit --omit=dev --audit-level=high

  # Avaliação do prompt contra a API real: roda só se o secret LLM_API_KEY existir.
  eval:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ github.event_name == 'push' }}
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm run eval
        run: |
          if [ -z "$LLM_API_KEY" ]; then echo "LLM_API_KEY não configurada; pulando avaliação"; exit 0; fi
          npm run eval

  # Garante que a imagem de produção compila (o push da imagem fica no release.yml).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
